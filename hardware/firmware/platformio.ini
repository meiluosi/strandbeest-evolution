; ESP32 firmware for the Strandbeest test rig. NOT compiled or run on hardware by the authors yet:
; the logic in lib/rigcore is unit-tested on the host (make test); src/main.cpp is thin glue around it.
[env:esp32dev]
platform = espressif32@^6.9.0  ; Arduino-ESP32 2.x: the LEDC calls in main.cpp use its API
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -DSTRANDBEEST_FW_VERSION=\"0.1\"
lib_deps =
    adafruit/Adafruit INA219
    bogde/HX711
