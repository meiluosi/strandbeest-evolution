[package]
name = "beest-kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "beest_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
# Official JS/wasm ABI and exception bridge; absent from native and Python builds.
wasm-bindgen = { version = "=0.2.105", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
