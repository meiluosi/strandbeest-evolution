[project]
name = "strandbeest-agent"
version = "0.1.0"
description = "Typed tool surface and an MCP server so that agents can design, simulate, read the glass-box layers and keep lab notes"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["strandbeest-common", "strandbeest-sim", "strandbeest-fab", "strandbeest-api", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strandbeest-mcp = "strandbeest_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strandbeest_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a simulation (skipped by the fast suite)"]
