[project]
name = "strandbeest-common"
version = "0.1.0"
description = "Shared contracts for the Strandbeest platform: schemas, Design model, linkage kinematics"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.20", "pydantic>=2.6"]

[project.scripts]
strandbeest-migrate = "strandbeest_common.migrate:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strandbeest_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
