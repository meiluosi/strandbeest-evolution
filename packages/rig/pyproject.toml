[project]
name = "strandbeest-rig"
version = "0.1.0"
description = "Test-rig tooling: serial logging, raw-to-Measurement conversion with quality checks, video tracking, torque calibration, a virtual rig"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["strandbeest-common", "numpy>=1.26"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
serial = ["pyserial>=3.5"]
sim = ["strandbeest-sim"]
dev = ["pytest>=8", "opencv-python-headless>=4.8", "pyserial>=3.5", "strandbeest-sim"]

[project.scripts]
strandbeest-rig = "strandbeest_rig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strandbeest_rig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
