[project]
name = "strandbeest-sim"
version = "0.1.0"
description = "Configurable MuJoCo dynamics simulator for Strandbeest-style linkage walkers"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mujoco>=3.1", "numpy>=1.26", "pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strandbeest-sim = "strandbeest_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strandbeest_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
