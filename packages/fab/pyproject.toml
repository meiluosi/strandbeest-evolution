[project]
name = "strandbeest-fab"
version = "0.1.0"
description = "Turn a Strandbeest Design into printable parts, a bill of materials and assembly notes"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["strandbeest-common", "shapely>=2.0", "trimesh>=4.0", "numpy>=1.26", "mapbox-earcut>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strandbeest-fab = "strandbeest_fab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strandbeest_fab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
