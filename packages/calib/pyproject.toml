[project]
name = "strandbeest-calib"
version = "0.1.0"
description = "Fit simulator parameters to measurements of a physical build"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["strandbeest-common", "strandbeest-sim", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strandbeest_calib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the simulator many times (minutes)"]
