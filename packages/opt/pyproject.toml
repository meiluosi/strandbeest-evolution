[project]
name = "strandbeest-opt"
version = "0.1.0"
description = "Optimisers behind an ask/tell interface (CMA-ES, NSGA-II), quality-diversity (MAP-Elites) and Bayesian calibration"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["strandbeest-common", "numpy>=1.26", "scipy>=1.11", "cma>=4.0", "pymoo>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strandbeest_opt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long optimisation runs (skipped by the fast suite)"]
